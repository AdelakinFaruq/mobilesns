{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mobiletopit Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      width: 350px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    form p {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      margin-top: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #007bff;
      color: white;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h1>Mobiletopit</h1>

    <h2>Customer Login</h2>

    <form method="POST">
      {% csrf_token %}

      {{ form.as_p }}

      <button type="submit">
        Login
      </button>
    </form>

  </div>

</body>

</html>
